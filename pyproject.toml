[project]
name = "gsc-auto-indexer"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.1",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "prompt-toolkit>=3.0.53",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.14.10",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
